[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-baby-simulator"
version = "0.3.0"
description = "A local-first AI character simulator with persistent memory and gradual growth"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "AI Baby contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
ai-baby = "ai_baby.main:main"
ai-baby-backup = "ai_baby.backup:main"
ai-baby-doctor = "ai_baby.doctor:main"
ai-baby-export = "ai_baby.export:main"
ai-baby-restore = "ai_baby.restore:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
