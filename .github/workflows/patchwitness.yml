name: PatchWitness

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install AI Baby quality tools and pinned PatchWitness
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m pip install --disable-pip-version-check "git+https://github.com/pangxueyuan2-creator/patchwitness.git@b1a99dfe01e6010f9e989981e79d1fde45bb6cb9"
      - name: Gate against authoritative base policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVIDENCE_PATH: ${{ runner.temp }}/patchwitness-pr.json
        run: |
          set +e
          patchwitness gate \
            --base "$BASE_SHA" \
            --policy-ref "$BASE_SHA" \
            --clean-room \
            --output "$EVIDENCE_PATH"
          code=$?
          if [ -f "$EVIDENCE_PATH" ]; then
            patchwitness report "$EVIDENCE_PATH" --format markdown >> "$GITHUB_STEP_SUMMARY"
            patchwitness report "$EVIDENCE_PATH" --format github
          fi
          exit "$code"
