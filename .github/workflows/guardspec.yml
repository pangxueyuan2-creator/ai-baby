name: GuardSpec preflight

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  instruction-preflight:
    name: GuardSpec instruction preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout AI Baby
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: consumer
          persist-credentials: false

      - name: Checkout reviewed GuardSpec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pangxueyuan2-creator/guardspec
          ref: 96ac5a2a2f82d174532ae577771cc8efd5ac774b
          path: guardspec
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.22.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: guardspec/pnpm-lock.yaml

      - name: Build reviewed GuardSpec
        working-directory: guardspec
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build

      - name: Validate AI Baby instruction hygiene
        run: node guardspec/dist/bin.js instructions check --root consumer --json

      - name: Prove representative runtime applicability
        run: node guardspec/dist/bin.js instructions explain src/ai_baby/main.py --root consumer --json
