name: Maintenance audit

on:
  push:
    branches: [maintenance/memory-audit-20260917]
    paths: [.github/workflows/maintenance-audit.yml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Archive tracked source only
        run: |
          mkdir -p "$RUNNER_TEMP/audit"
          git archive --format=zip HEAD -o "$RUNNER_TEMP/audit/source.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/audit/commit.txt"
      - name: Baseline checks
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q | tee "$RUNNER_TEMP/audit/pytest.txt"
          python -m ruff check .
          python -m ruff format --check .
          python -m build
          python scripts/acceptance_demo.py | tee "$RUNNER_TEMP/audit/acceptance.txt"
      - name: Publish audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maintenance-source-and-baseline
          path: ${{ runner.temp }}/audit/
          retention-days: 3
          if-no-files-found: error
